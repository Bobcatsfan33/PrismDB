openapi: 3.1.0
info:
  title: PrismDB authenticated read API
  version: 1.0.0
  description: Tenant-scoped, read-only search over mandatory mutual TLS.
servers:
  - url: https://prismdb.internal:8443
security:
  - mutualTLS: []
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Every configured shard passed authenticated readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /metrics:
    get:
      operationId: metrics
      responses:
        "200":
          description: Fixed-cardinality Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/search:
    post:
      operationId: search
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Complete tenant-scoped search result.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, result]
                properties:
                  request_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
  schemas:
    Status:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
        version:
          const: v1
    SearchRequest:
      type: object
      additionalProperties: false
      required: [tenant, text]
      properties:
        tenant:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        text:
          type: string
          minLength: 1
          maxLength: 65536
        time_from:
          type: integer
          format: int64
        time_to:
          type: integer
          format: int64
        k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        group_k:
          type: integer
          minimum: 1
          maximum: 100
        space:
          type: string
          minLength: 1
          maxLength: 256
        threshold:
          type: number
          minimum: -1
          maximum: 1
        explain:
          type: boolean
          default: false
        fetch_budget_bytes:
          type: integer
          minimum: 0
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
  responses:
    BadRequest:
      description: The bounded request or query was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The certificate, scope, or tenant is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The certificate identity reached its in-flight limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The complete query or readiness check could not reach a required shard.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
