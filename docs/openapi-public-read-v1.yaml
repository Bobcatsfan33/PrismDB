openapi: 3.1.0
info:
  title: PrismDB authenticated API
  version: 1.1.0
  description: Tenant-scoped search and durable ingest over mandatory mutual TLS.
servers:
  - url: https://prismdb.internal:8443
security:
  - mutualTLS: []
paths:
  /healthz:
    get:
      operationId: health
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Every configured shard passed authenticated readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
  /metrics:
    get:
      operationId: metrics
      responses:
        "200":
          description: Fixed-cardinality Prometheus metrics.
          content:
            text/plain:
              schema:
                type: string
        "403":
          $ref: "#/components/responses/Forbidden"
  /v1/search:
    post:
      operationId: search
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: Complete tenant-scoped search result.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, result]
                properties:
                  request_id:
                    type: string
                  result:
                    $ref: "#/components/schemas/IngestReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /v1/events:
    post:
      operationId: ingestEvents
      parameters:
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IngestRequest"
      responses:
        "200":
          description: Admission and publication result after remote-durable acknowledgement.
          content:
            application/json:
              schema:
                type: object
                required: [request_id, result]
                properties:
                  request_id:
                    type: string
                  result:
                    type: object
                    additionalProperties: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
  schemas:
    Status:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
        version:
          const: v1
    SearchRequest:
      type: object
      additionalProperties: false
      required: [tenant, text]
      properties:
        tenant:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        text:
          type: string
          minLength: 1
          maxLength: 65536
        time_from:
          type: integer
          format: int64
        time_to:
          type: integer
          format: int64
        k:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
        group_k:
          type: integer
          minimum: 1
          maximum: 100
        space:
          type: string
          minLength: 1
          maxLength: 256
        threshold:
          type: number
          minimum: -1
          maximum: 1
        explain:
          type: boolean
          default: false
        fetch_budget_bytes:
          type: integer
          minimum: 0
    IngestRequest:
      type: object
      additionalProperties: false
      required: [tenant, events]
      properties:
        tenant:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,128}$"
        events:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: "#/components/schemas/Event"
    IngestReport:
      type: object
      additionalProperties: false
      required:
        - offered
        - published
        - duplicates_suppressed
        - dead_lettered
        - by_reason
        - snapshot_id
      properties:
        offered:
          type: integer
          minimum: 0
        published:
          type: integer
          minimum: 0
        duplicates_suppressed:
          type: integer
          minimum: 0
        dead_lettered:
          type: integer
          minimum: 0
        by_reason:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
        snapshot_id:
          type: string
    Event:
      type: object
      additionalProperties: false
      required: [event_id, event_time, event_name, cost, error, body]
      properties:
        event_id:
          type: string
          minLength: 1
          maxLength: 256
        event_time:
          type: integer
          format: int64
        event_name:
          type: string
          minLength: 1
          maxLength: 256
        cost:
          type: number
          minimum: 0
        error:
          type: boolean
        body:
          type: string
          minLength: 1
          maxLength: 262144
        trace_id:
          type: string
          maxLength: 128
        span_id:
          type: string
          maxLength: 64
        attributes:
          type: object
          maxProperties: 64
          propertyNames:
            minLength: 1
            maxLength: 128
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/StringAttribute"
              - $ref: "#/components/schemas/IntegerAttribute"
              - $ref: "#/components/schemas/DoubleAttribute"
              - $ref: "#/components/schemas/BooleanAttribute"
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 256
          description: Stable tenant-scoped retry key; reuse with different content is refused.
    StringAttribute:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          const: str
        value:
          type: string
          maxLength: 4096
    IntegerAttribute:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          const: int
        value:
          type: integer
          format: int64
    DoubleAttribute:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          const: double
        value:
          type: number
    BooleanAttribute:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type:
          const: bool
        value:
          type: boolean
    Error:
      type: object
      required: [error, message, request_id]
      properties:
        error:
          type: string
        message:
          type: string
        request_id:
          type: string
  responses:
    BadRequest:
      description: The bounded request, query, or event batch was invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The certificate, scope, or tenant is not authorized.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: The certificate identity reached its in-flight limit.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unavailable:
      description: The complete query, ingest, or readiness check could not reach a required shard.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
