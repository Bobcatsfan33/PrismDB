topology:
  version: 1
  shards:
    - shard_id: 0
      address: prism-prism-shard-0.prism-prism-shard.prism.svc.cluster.local:7443
      server_name: prism-prism-shard-0.prism-prism-shard.prism.svc.cluster.local
    - shard_id: 1
      address: prism-prism-shard-1.prism-prism-shard.prism.svc.cluster.local:7443
      server_name: prism-prism-shard-1.prism-prism-shard.prism.svc.cluster.local
networkPolicy:
