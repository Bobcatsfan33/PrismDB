    kubernetes.io/metadata.name: prism
  coordinatorPodLabels:
    app.kubernetes.io/name: prismdb
  modelNamespaceLabels:
    kubernetes.io/metadata.name: prism-model
  modelPodLabels:
    app.kubernetes.io/name: prism-model-service
  modelPort: 8443
  monitoringNamespaceLabels:
