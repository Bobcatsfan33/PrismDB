[workspace]
resolver = "2"
members = [
    "crates/prism-types",
    "crates/prism-quantizer",
    "crates/prism-part",
    "crates/prism-sql",
    "crates/prism-engine",
    "crates/prism-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Bobcatsfan33/PrismDB"

# Dependency policy (see docs/DECISIONS.md, D-002):
# The engine is dependency-light by charter. serde/serde_json handle durable
# JSON. native-tls is the single security exception authorized by D-065:
# production object storage requires a platform-maintained, certificate-
# validating TLS implementation and must never use a hand-rolled TLS stack.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.2.14+ requires Rust 1.80; Prism's declared MSRV is 1.75.
native-tls = "=0.2.13"
prism-types = { path = "crates/prism-types" }
prism-quantizer = { path = "crates/prism-quantizer" }
prism-part = { path = "crates/prism-part" }
prism-sql = { path = "crates/prism-sql" }
prism-engine = { path = "crates/prism-engine" }

[profile.release]
debug = 1
