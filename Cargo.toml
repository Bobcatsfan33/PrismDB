[workspace]
resolver = "2"
members = [
    "crates/prism-types",
    "crates/prism-quantizer",
    "crates/prism-part",
    "crates/prism-sql",
    "crates/prism-engine",
    "crates/prism-cli",
    "crates/prism-service",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
repository = "https://github.com/Bobcatsfan33/PrismDB"

# Dependency policy (see docs/DECISIONS.md, D-002):
# The engine is dependency-light by charter. serde/serde_json handle durable
# JSON. TLS is the security exception authorized by D-065/D-088: native-tls
# protects production object storage, while rustls protects the mutual-auth
# shard boundary that native-tls cannot express server-side. Neither may be
# replaced with a hand-rolled TLS stack.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 0.2.14+ requires Rust 1.80; Prism's declared MSRV is 1.75.
native-tls = "=0.2.13"
# 0.23.35 declares Rust 1.71 compatibility, below PrismDB's Rust 1.75 MSRV. The
# first 0.21 implementation was rejected before merge because cargo-audit found
# advisories in its ring/webpki line. Unlike native-tls, rustls can require and
# verify client certificates on a server, which is mandatory at this boundary.
rustls = { version = "=0.23.35", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "=1.13.2", features = ["std"] }
signal-hook = "=0.3.18"
# The one hand-rolling exception the dependency charter makes, argued in D-095: a hash has one
# publishable test vector and no state, while an AEAD has nonce management, constant-time tag
# comparison, and failure modes no NIST vector detects. Pinned because 0.11 raises the MSRV above
# the declared 1.75; `zeroize` stays at 1.8.1 for the same reason (1.9 requires edition2024, which
# Cargo 1.75 cannot parse).
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc", "getrandom"] }
# No `zeroize_derive`: that feature pulls zeroize_derive 1.5.0, whose manifest requires
# edition2024 and which Cargo 1.75 cannot even parse. `Zeroizing<T>` and the trait cover the key
# cache without the proc macro.
zeroize = { version = "=1.8.1", default-features = false, features = ["alloc"] }
# Cargo.lock intentionally holds zeroize 1.8.1, tempfile 3.10.1, openssl
# 0.10.75, and openssl-sys 0.9.111: newer semver-compatible releases in these
# lines require Cargo/rustc newer than the declared MSRV. The locked Linux MSRV
# CI job prevents those target-specific transitive bounds from drifting.
prism-types = { path = "crates/prism-types" }
prism-quantizer = { path = "crates/prism-quantizer" }
prism-part = { path = "crates/prism-part" }
prism-sql = { path = "crates/prism-sql" }
prism-engine = { path = "crates/prism-engine" }

[profile.release]
debug = 1
